name: Release and publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v"
        required: true
        type: string
      dry_run:
        description: "Build and validate everything without publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate release metadata
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must run from $DEFAULT_BRANCH."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must be a valid semantic version without a leading v."
            exit 1
          fi

          workspace_version=$(sed -n \
            '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' \
            Cargo.toml)
          sdk_version=$(jq -r '.version' sdk/package.json)
          sdk_lock_version=$(jq -r '.packages[""].version' sdk/package-lock.json)

          if [[ "$workspace_version" != "$VERSION" ]]; then
            echo "::error::Cargo.toml version is $workspace_version, expected $VERSION."
            exit 1
          fi
          if [[ "$sdk_version" != "$VERSION" ]]; then
            echo "::error::sdk/package.json version is $sdk_version, expected $VERSION."
            exit 1
          fi
          if [[ "$sdk_lock_version" != "$VERSION" ]]; then
            echo "::error::sdk/package-lock.json version is $sdk_lock_version, expected $VERSION."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

          awk -v version="$VERSION" '
            function heading_version(line, label) {
              if (line !~ /^##[[:space:]]+/) {
                return ""
              }
              label = line
              sub(/^##[[:space:]]+/, "", label)
              sub(/[[:space:]].*$/, "", label)
              sub(/^\[/, "", label)
              sub(/\]$/, "", label)
              sub(/^v/, "", label)
              return label
            }

            heading_version($0) == version {
              found = 1
              next
            }
            found && /^##[[:space:]]+/ {
              exit
            }
            found {
              print
            }
            END {
              if (!found) {
                exit 2
              }
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md" || {
            echo "::error::CHANGELOG.md has no section for version $VERSION."
            exit 1
          }

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::The CHANGELOG.md section for $VERSION is empty."
            exit 1
          fi

          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            kind: linux
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            kind: linux
          - target: x86_64-apple-darwin
            os: macos-15-intel
            kind: macos
          - target: aarch64-apple-darwin
            os: macos-15
            kind: macos
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            kind: windows
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            kind: windows
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install Rust target
        if: matrix.kind != 'windows'
        run: rustup target add "$TARGET"
      - name: Install Rust target
        if: matrix.kind == 'windows'
        run: rustup target add "$env:TARGET"
      - name: Install musl build dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make musl-tools perl pkg-config
      - name: Build static Linux binary
        if: matrix.kind == 'linux'
        run: |
          set -euo pipefail

          linker_env=${TARGET^^}
          linker_env=${linker_env//-/_}
          export "CARGO_TARGET_${linker_env}_LINKER=musl-gcc"
          CC=musl-gcc just build_smista_release "$TARGET"

          file "target/$TARGET/release/smista"
          if readelf -l "target/$TARGET/release/smista" | grep -q interpreter; then
            echo "::error::Linux release binary is dynamically linked."
            exit 1
          fi
      - name: Build macOS binary
        if: matrix.kind == 'macos'
        run: just build_smista_release "$TARGET"
      - name: Build Windows binary
        if: matrix.kind == 'windows'
        shell: pwsh
        run: just build_smista_release "$env:TARGET"
      - name: Package Unix binary
        if: matrix.kind != 'windows'
        run: |
          set -euo pipefail

          mkdir -p artifact
          archive="smista-v$VERSION-$TARGET.tar.gz"
          cp "target/$TARGET/release/smista" artifact/smista
          tar -czf "artifact/$archive" -C artifact smista
          shasum -a 256 "artifact/$archive" |
            awk '{print $1}' > "artifact/$archive.sha256"
          rm artifact/smista
      - name: Package Windows binary
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $archive = "smista-v$env:VERSION-$env:TARGET.zip"
          Copy-Item "target/$env:TARGET/release/smista.exe" artifact/smista.exe
          Compress-Archive `
            -Path artifact/smista.exe `
            -DestinationPath "artifact/$archive"
          (Get-FileHash "artifact/$archive" -Algorithm SHA256).Hash.ToLower() |
            Out-File -NoNewline "artifact/$archive.sha256"
          Remove-Item artifact/smista.exe
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: artifact/*
          retention-days: 1
          if-no-files-found: error

  publish-crates:
    name: Publish crates.io packages
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Dry-run crates.io publish
        if: ${{ inputs.dry_run }}
        run: just publish_crates "--dry-run"
      - name: Authenticate to crates.io
        if: ${{ !inputs.dry_run }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates.io packages
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: just publish_crates

  publish-sdk:
    name: Publish npm package
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install npm dependencies
        run: just sdk_install
      - name: Check npm version is unpublished
        if: ${{ !inputs.dry_run }}
        run: |
          if npm view "@smista-ai/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "::error::@smista-ai/sdk@$VERSION is already published."
            exit 1
          fi
      - name: Dry-run npm publish
        if: ${{ inputs.dry_run }}
        env:
          NPM_CONFIG_TAG: ${{ contains(inputs.version, '-') && 'next' || 'latest' }}
        run: just sdk_npm publish --dry-run
      - name: Publish npm package
        if: ${{ !inputs.dry_run }}
        env:
          NPM_CONFIG_TAG: ${{ contains(inputs.version, '-') && 'next' || 'latest' }}
        run: just publish_sdk

  github-release:
    name: Create GitHub release
    needs: [build, publish-crates, publish-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: out
          merge-multiple: true
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      - name: Upload release assets
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-dry-run
          path: out/*
          retention-days: 3
          if-no-files-found: error
      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" out/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file notes/release-notes.md

  publish-homebrew:
    name: Update Homebrew tap
    needs: [build, github-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true
      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: smista-ai/homebrew-smista
          path: tap
          persist-credentials: false
      - name: Rewrite formula
        run: |
          set -euo pipefail

          sha_mac_arm=$(cat "artifacts/smista-v$VERSION-aarch64-apple-darwin.tar.gz.sha256")
          sha_mac_x64=$(cat "artifacts/smista-v$VERSION-x86_64-apple-darwin.tar.gz.sha256")
          sha_linux_arm=$(cat "artifacts/smista-v$VERSION-aarch64-unknown-linux-musl.tar.gz.sha256")
          sha_linux_x64=$(cat "artifacts/smista-v$VERSION-x86_64-unknown-linux-musl.tar.gz.sha256")
          base="https://github.com/smista-ai/smista.ai/releases/download/v$VERSION"

          mkdir -p tap/Formula
          cat > tap/Formula/smista.rb <<EOF
          class Smista < Formula
            desc "Local-first agent with deterministic model routing"
            homepage "https://smista.ai"
            license "Elastic-2.0"
            version "$VERSION"

            on_macos do
              on_arm do
                url "$base/smista-v$VERSION-aarch64-apple-darwin.tar.gz"
                sha256 "$sha_mac_arm"
              end
              on_intel do
                url "$base/smista-v$VERSION-x86_64-apple-darwin.tar.gz"
                sha256 "$sha_mac_x64"
              end
            end

            on_linux do
              on_arm do
                url "$base/smista-v$VERSION-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$sha_linux_arm"
              end
              on_intel do
                url "$base/smista-v$VERSION-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$sha_linux_x64"
              end
            end

            def install
              bin.install "smista"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/smista --version")
            end
          end
          EOF
      - name: Show formula
        if: ${{ inputs.dry_run }}
        run: cat tap/Formula/smista.rb
      - name: Commit and push formula
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          cd tap
          git config user.name "smista release"
          git config user.email "release@smista.ai"
          git add Formula/smista.rb
          git commit -m "smista $VERSION"
          gh auth setup-git
          git push origin HEAD:main
