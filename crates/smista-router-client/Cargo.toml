[package]
name = "smista-router-client"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = "MIT"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "Async Rust client for the smista-router HTTP JSON API."

[package.metadata.docs.rs]
# Build docs with every backend so docs.rs renders the reqwest client, and emit
# the `docsrs` cfg so `#[doc(cfg(...))]` feature badges are shown.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
isahc = ["dep:isahc", "dep:tracing"]
reqwest = ["dep:reqwest", "dep:tokio", "dep:tracing"]
ureq = ["dep:tracing", "dep:ureq"]

[dependencies]
futures = { workspace = true }
isahc = { workspace = true, features = ["json", "log", "static-curl", "rustls-tls", "tls"], optional = true }
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"], optional = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smista-core = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tracing = { workspace = true, optional = true }
ureq = { workspace = true, features = ["gzip", "json", "rustls"], optional = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rust_decimal = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
