# Complete example smista-cli configuration (config.toml).
#
# Mirrors the configuration described in the specification. Used as a parsing
# fixture in tests and as the worked example in the documentation. Secrets are
# referenced by key name (see api_key_ref) and never stored inline.

# --- Providers -------------------------------------------------------------

[providers.openai]
type = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[providers.ollama]
type = "ollama"
base_url = "http://localhost:11434"

# --- Models ----------------------------------------------------------------

[models."openai/gpt-5.5-thinking"]
provider = "openai"
name = "gpt-5.5-thinking"
requires_api_key = true
local = false
supports_streaming = true
supports_tools = true
supports_json_output = true
supports_reasoning = true
max_context_tokens = 200000

[models."ollama/qwen2.5-coder"]
provider = "ollama"
name = "qwen2.5-coder"
requires_api_key = false
local = true
supports_streaming = true
supports_tools = false
max_context_tokens = 32768

# --- Routing ---------------------------------------------------------------

# Used when no rule matches.
[routing.default]
model = "openai/gpt-5.5-mini"
fallbacks = ["ollama/qwen2.5-coder"]

[[routing.rules]]
name = "review security-sensitive code locally"
priority = 5
intent = "review"
paths = ["src/crypto/**", "src/auth/**"]
local_only = true
model = "ollama/qwen2.5-coder"

[[routing.rules]]
name = "plan with strongest reasoning model"
priority = 10
intent = "plan"
model = "openai/gpt-5.5-thinking"
fallbacks = ["anthropic/claude-sonnet"]

[[routing.rules]]
name = "use local model for changelog skill"
priority = 20
skill = "changelog"
model = "ollama/qwen2.5-coder"
fallbacks = ["openai/gpt-5.5-mini"]

[[routing.rules]]
name = "auth code uses Claude"
priority = 30
intent = "edit"
paths = ["src/auth/**"]
model = "anthropic/claude-sonnet"
fallbacks = ["openai/gpt-5.5-thinking"]

# --- Classification --------------------------------------------------------

[classification]
default_intent = "chat"

[[classification.rules]]
intent = "review"
priority = 10
keywords = ["review", "audit", "check", "inspect"]
requires_any_context = ["git_diff", "pull_request"]

[[classification.rules]]
intent = "edit"
priority = 20
keywords = ["change", "modify", "refactor", "fix", "implement"]

# --- Tool permissions ------------------------------------------------------

[tools.permissions]
file_read = "allow"
file_write = "ask"
shell = "ask"
network = "deny"
git = "allow"

# --- Privacy ---------------------------------------------------------------

[privacy]
restricted_paths = [".env", "secrets/**", "*.pem", "*.key"]

[privacy.remote]
mode = "ask"
blocked_paths = [".env", "secrets/**"]

[privacy.local]
mode = "allow"

# --- Router client ---------------------------------------------------------

[router]
url = "http://127.0.0.1:7331"
auto_start = true
connect_timeout_ms = 5000
request_timeout_ms = 120000
auth_source = "keychain"

# --- Local preferences (uncommitted) ---------------------------------------

[local_preferences]
auto_apply = false
stream = true
local_only = false
no_network = false
