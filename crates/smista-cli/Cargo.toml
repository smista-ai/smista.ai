[package]
name = "smista-cli"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = "Elastic-2.0"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "smista command-line interface."

[[bin]]
name = "smista"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
globset = { workspace = true }
keyring-core = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
smista-router = { workspace = true }
smista-sdk = { workspace = true }
sysinfo = { workspace = true, features = ["system"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
yaml_serde = { workspace = true }

[target."cfg(target_os = \"linux\")".dependencies]
zbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }

[target."cfg(target_os = \"macos\")".dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

[target."cfg(target_family = \"windows\")".dependencies]
windows-native-keyring-store = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
