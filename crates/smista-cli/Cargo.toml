[package]
name = "smista-cli"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = "Elastic-2.0"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "smista command-line interface."

[[bin]]
name = "smista"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
clap = { workspace = true, features = ["color", "derive", "env", "help", "std", "suggestions", "usage"] }
crossterm = { workspace = true, features = ["bracketed-paste", "event-stream", "events", "windows"] }
futures = { workspace = true }
gix = { workspace = true, features = ["sha1", "status"] }
globset = { workspace = true }
keyring-core = { workspace = true }
open = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { workspace = true }
rand = { workspace = true }
ratatui = { workspace = true, features = ["crossterm", "layout-cache", "macros", "std", "unstable-rendered-line-info"] }
# Activate scrolling regions narrowly because Ratatui 0.30.2's aggregate feature resolves unused backends.
ratatui-core = { workspace = true }
ratatui-crossterm = { workspace = true }
rust_decimal = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
smista-router = { workspace = true }
smista-sdk = { workspace = true, features = ["reqwest-client"] }
sysinfo = { workspace = true, features = ["system"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
url = { workspace = true }
uuid = { workspace = true }
yaml_serde = { workspace = true }

[target."cfg(target_os = \"linux\")".dependencies]
zbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }

[target."cfg(target_os = \"macos\")".dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }

[target."cfg(target_family = \"windows\")".dependencies]
windows-native-keyring-store = { workspace = true }

[dev-dependencies]
smista-mock-web-server = { workspace = true }
tempfile = { workspace = true }
