[package]
name = "smista-sdk"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = "MIT"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "Rust SDK facade for smista.ai: a single entry point re-exporting the domain types and the router client."

[package.metadata.docs.rs]
# Build docs with every backend so docs.rs renders the reqwest client, and emit
# the `docsrs` cfg so `#[doc(cfg(...))]` feature badges are shown.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
reqwest-client = ["smista-router-client/reqwest"]
ureq-client = ["smista-router-client/ureq"]

[dependencies]
smista-core = { workspace = true }
smista-router-client = { workspace = true }
