[package]
name = "smista-core"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = "MIT"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "Shared domain types, configuration, routing policy and trace structures for smista.ai."

[features]
openapi = ["dep:utoipa"]
surrealdb = ["dep:surrealdb-types"]
ts = ["dep:ts-rs"]

[dependencies]
chrono = { workspace = true, features = ["serde"] }
dirs = { workspace = true }
globset = { workspace = true }
http = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-str", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
surrealdb-types = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, features = ["chrono-impl", "serde-json-impl", "uuid-impl"], optional = true }
utoipa = { workspace = true, features = ["chrono", "preserve_order", "uuid"], optional = true }
uuid = { workspace = true, features = ["serde", "v7"] }
