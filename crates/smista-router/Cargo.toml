[package]
name = "smista-router"
version = { workspace = true }
authors = { workspace = true }
categories = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = "Elastic-2.0"
readme = "README.md"
repository = { workspace = true }
rust-version = { workspace = true }
description = "smista-router service: routing, orchestration and the HTTP API host."

[features]
openapi = ["dep:utoipa", "smista-core/openapi"]

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true, features = ["password-hash"] }
axum = { workspace = true, features = ["http1", "http2", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing"] }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
password-hash = { workspace = true }
rand = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-str"] }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
sha-crypt = { workspace = true, features = ["alloc", "password-hash"] }
smista-core = { workspace = true }
smista-providers = { workspace = true }
smista-storage = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tower_governor = { workspace = true, features = ["axum", "tracing"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true, features = ["serde"] }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
serde_json = { workspace = true }
surrealdb = { workspace = true, features = ["kv-mem"] }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["serde", "v7"] }
