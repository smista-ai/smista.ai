# Complete example smista-router runtime configuration (router.toml).
#
# Mirrors the router configuration described in the specification. Used as a
# parsing fixture in tests and as the worked example in the documentation.
# This is separate from the routing policy: it controls how the router process
# itself runs.

[router]
host = "127.0.0.1"
port = 7331

[router.storage]
engine = "surrealdb"
mode = "embedded"
path = ".smista/db"
namespace = "smista"
database = "local"

[router.auth]
token_ttl_seconds = 86400
api_key_version = "01"
local_bootstrap_enabled = true

[router.limits]
max_request_body_bytes = 10485760
max_context_bytes = 5242880
max_concurrent_requests = 8
request_timeout_ms = 120000
provider_timeout_ms = 180000
tool_timeout_ms = 60000

[router.logging]
level = "info"
format = "compact"
redact_secrets = true

[router.cors]
enabled = false
allowed_origins = ["https://app.smista.ai"]

[router.retention]
trace_retention_days = 90
session_retention_days = 365
deleted_session_retention_days = 30

[router.ollama]
enabled = true
base_url = "http://127.0.0.1:11434"
auto_discover_models = true
startup_healthcheck = true
startup_required = false
model_refresh_interval_seconds = 300

[router.ollama.limits]
max_concurrent_requests = 4
request_timeout_ms = 180000
pull_timeout_ms = 600000

[router.ollama.models]
preload = ["llama3.1:8b", "qwen2.5-coder:7b"]
allow_pull = false
allowed_models = ["llama3.1:8b", "qwen2.5-coder:7b", "mistral:7b"]

[router.providers.openai]
base_url = "https://api.openai.com/v1"
