[package]
name = "provider-integration-tests"
version = { workspace = true }
edition = { workspace = true }
license = "Elastic-2.0"
publish = false
description = "API-key-gated provider integration tests for the smista.ai workspace."

[dependencies]
smista-providers = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
