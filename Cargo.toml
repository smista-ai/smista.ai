[workspace]
members = [
  "crates/integration-tests/provider-integration-tests",
  "crates/integration-tests/storage-integration-tests",
  "crates/mock-web-server",
  "crates/smista-cli",
  "crates/smista-core",
  "crates/smista-providers",
  "crates/smista-router",
  "crates/smista-router-client",
  "crates/smista-sdk",
  "crates/smista-storage",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
authors = ["Christian Visintin <christian.visintin@veeso.dev>"]
categories = [
  "artificial-intelligence",
  "command-line-utilities",
  "development-tools",
]
edition = "2024"
homepage = "https://smista.ai"
keywords = ["ai", "llm", "cli", "agent", "routing"]
# Licensing is per-crate: MIT for the consumer-facing libraries
# (smista-core, smista-router-client, smista-sdk) and Elastic-2.0 for the rest.
# Each member crate sets its own `license` field; there is no workspace default.
license = "MIT"
repository = "https://github.com/smista-ai/smista.ai"
rust-version = "1.95.0"
description = "Local-first agent and CLI that deterministically routes each phase of an AI workflow to the most suitable model."

[workspace.dependencies]
anyhow = "1"
apple-native-keyring-store = { version = "1", default-features = false }
argon2 = { version = "0.5", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
chrono = "0.4"
clap = { version = "4", default-features = false }
crossterm = { version = "0.29", default-features = false }
dirs = "6"
futures = "0.3"
gix = { version = "0.85", default-features = false }
globset = "0.4"
http = "1"
isahc = { version = "2", default-features = false }
keyring-core = { version = "1", default-features = false }
open = "5"
opentelemetry = "0.32"
opentelemetry-otlp = "0.32"
opentelemetry_sdk = "0.32"
password-hash = { version = "0.6", default-features = false }
rand = "0.10"
rapidfuzz = "0.5"
ratatui = { version = "0.30", default-features = false }
ratatui-core = { version = "0.1.2", default-features = false, features = ["scrolling-regions"] }
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["scrolling-regions"] }
reqwest = { version = "0.13", default-features = false }
rig-core = "0.40"
rust_decimal = { version = "1", default-features = false }
secrecy = "0.10"
serde = "1"
serde_json = "1"
sha-crypt = { version = "0.6", default-features = false }
sha2 = "0.11"
smista-core = { version = "0.0", path = "crates/smista-core" }
smista-providers = { version = "0.0", path = "crates/smista-providers" }
smista-router = { version = "0.0", path = "crates/smista-router" }
smista-router-client = { version = "0.0", path = "crates/smista-router-client" }
smista-sdk = { version = "0.0", path = "crates/smista-sdk" }
smista-storage = { version = "0.0", path = "crates/smista-storage" }
surrealdb = "3"
surrealdb-types = "3"
sysinfo = { version = "0.39", default-features = false }
tempfile = "3"
testcontainers = "0.27"
thiserror = "2"
tokio = "1"
tokio-util = "0.7"
toml = "1"
tower = "0.5"
tower_governor = { version = "0.8", default-features = false }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
ts-rs = "12"
ureq = { version = "3", default-features = false }
url = "2"
utoipa = "5"
uuid = "1"
windows-native-keyring-store = { version = "1", default-features = false }
wiremock = "0.6"
yaml_serde = "0.10"
zbus-secret-service-keyring-store = { version = "1", default-features = false }

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1
