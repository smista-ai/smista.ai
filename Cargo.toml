[workspace]
members = [
  "crates/integration-tests",
  "crates/smista-cli",
  "crates/smista-core",
  "crates/smista-providers",
  "crates/smista-router",
  "crates/smista-router-client",
  "crates/smista-sdk",
  "crates/smista-storage",
  "crates/smista-web",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92.0"
authors = ["Christian Visintin <christian.visintin@veeso.dev>"]
description = "Local-first agent and CLI that deterministically routes each phase of an AI workflow to the most suitable model."
# Licensing is per-crate: MIT for the consumer-facing libraries
# (smista-core, smista-router-client, smista-sdk) and Elastic-2.0 for the rest.
# Each member crate sets its own `license` field; there is no workspace default.
license = "MIT"
repository = "https://github.com/smista-ai/smista.ai"
homepage = "https://smista.ai"
keywords = ["ai", "llm", "cli", "agent", "routing"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
globset = "0.4"
http = "1"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json", "stream"] }
rig-core = "0.38"
rust_decimal = { version = "1", default-features = false, features = [
  "serde-with-str",
  "std",
] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smista-core = { version = "0.0", path = "crates/smista-core" }
smista-providers = { version = "0.0", path = "crates/smista-providers" }
smista-router = { version = "0.0", path = "crates/smista-router" }
smista-router-client = { version = "0.0", path = "crates/smista-router-client" }
smista-sdk = { version = "0.0", path = "crates/smista-sdk" }
smista-storage = { version = "0.0", path = "crates/smista-storage" }
smista-web = { version = "0.0", path = "crates/smista-web" }
surrealdb = "3"
surrealdb-types = "3"
tempfile = "3"
testcontainers = "0.27"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = [
  "chrono-impl",
  "serde-json-impl",
  "uuid-impl",
] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
yaml_serde = "0.10"

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1
